name: admin_web
description: "Çekici Admin Web Dashboard"
publish_to: 'none'

version: 1.0.0+6





environment:
  sdk: ^3.7.0


dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.5.0
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  flutter_dotenv: ^5.1.0
  connectivity_plus: ^6.0.3
  fl_chart: ^0.69.0
  google_maps_flutter: ^2.14.0
  url_launcher: ^6.3.0
  http: ^1.2.0
  archive: ^4.0.2
  firebase_core: ^3.11.0
  firebase_auth: ^5.5.1


  # Monorepo packages:
  shared_models:
    path: ../../packages/shared_models
  shared_services:
    path: ../../packages/shared_services
  shared_ui:
    path: ../../packages/shared_ui
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/logo.png
